backend:
  name: github
  repo: hadungz/oceanhome-web
  branch: main
  base_url: https://oceanhome-cms-auth.hadungz.workers.dev

media_folder: "images/du-an"
public_folder: "images/du-an"

collections:
  - name: "du_an_list"
    label: "Quản lý Dự án"
    files:
      - name: "projects"
        label: "Danh sách toàn bộ Dự án"
        file: "data/projects.json"
        fields:
          - name: "items"
            label: "Các công trình dự án"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}}) - {{fields.address}}"
            fields:
              - { label: "Tiêu đề dự án", name: "title", widget: "string", hint: "Ví dụ: Thiết kế & Thi công Biệt thự 2 tầng mái Nhật" }
              - label: "Loại công trình (Tự động cập nhật vào Lĩnh vực xây dựng)"
                name: "category"
                widget: "select"
                options: ["Nhà Phố", "Biệt Thự", "Văn Phòng", "Khách Sạn", "Công Nghiệp"]
                default: "Nhà Phố"
              - { label: "Đưa ra Dự án nổi bật (Trang chủ)", name: "featured", widget: "boolean", default: true }
              - { label: "Chủ đầu tư", name: "client", widget: "string", required: false, hint: "Ví dụ: Anh Nam" }
              - { label: "Diện tích & Quy mô", name: "area", widget: "string", hint: "Ví dụ: 120m², 3 Tầng - 4 Phòng ngủ" }
              - { label: "Địa chỉ công trình", name: "address", widget: "string", hint: "Ví dụ: Hà Đông, Hà Nội" }
              - { label: "Ngày đăng", name: "date", widget: "datetime", format: "DD/MM/YYYY", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Ảnh bìa dự án", name: "cover", widget: "image" }
              - { label: "Nội dung chi tiết công trình (Có thể chèn nhiều ảnh mô tả)", name: "body", widget: "markdown" }
